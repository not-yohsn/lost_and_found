<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Service AI Chatbot — ERD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0f14;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    font-family: 'DM Mono', monospace;
    color: #e8eaf0;
    min-height: 100vh;
  }

  header { text-align: center; margin-bottom: 40px; }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(1.6rem, 3.5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #f5f7fa, #8899bb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    margin-top: 6px;
    font-size: 0.72rem;
    color: #4a5270;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .erd-svg-wrap { width: 100%; max-width: 1140px; overflow-x: auto; }

  svg#erd { display: block; width: 100%; height: auto; }

  .legend {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px 32px;
    font-size: 0.68rem;
    color: #4a5268;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .legend-item { display: flex; align-items: center; gap: 8px; }
  .leg-pk { background:#1e2e4a; color:#7eb8f7; padding:2px 7px; border-radius:4px; font-size:0.6rem; }
  .leg-fk { background:#1e3028; color:#72d489; padding:2px 7px; border-radius:4px; font-size:0.6rem; }

  footer {
    margin-top: 40px;
    font-size: 0.62rem;
    color: #252a3a;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>Customer Service AI Chatbot</h1>
  <p>Entity Relationship Diagram</p>
</header>
